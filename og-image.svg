<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c1f3d"/>
      <stop offset="100%" stop-color="#1e3a5f"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <!-- Subtle grid lines -->
  <line x1="0" y1="315" x2="1200" y2="315" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <line x1="600" y1="0" x2="600" y2="630" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
  <!-- Logo mark -->
  <rect x="480" y="155" width="80" height="80" rx="18" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1.5"/>
  <text x="520" y="214" text-anchor="middle" font-size="44" font-family="system-ui,sans-serif" fill="#ffffff">✈</text>
  <!-- Site name -->
  <text x="600" y="298" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="52" font-weight="700" fill="#ffffff" letter-spacing="-1">Aviation Parts Library</text>
  <!-- Tagline -->
  <text x="600" y="356" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="26" fill="#93c5fd" letter-spacing="0.5">29,500+ parts from official IPC catalogs</text>
  <!-- Aircraft list -->
  <text x="600" y="416" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="20" fill="#60a5fa">Cessna 150 · Cessna 172 · Cessna 182 · Piper PA-22</text>
  <!-- Bottom accent bar -->
  <rect x="0" y="590" width="1200" height="40" fill="rgba(37,99,235,0.4)"/>
  <text x="600" y="616" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="16" fill="rgba(255,255,255,0.6)" letter-spacing="1">787pas.github.io/Aircraft-Repair-Directory</text>
</svg>
